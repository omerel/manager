# Example runtime composition for the air-gapped network.
# The database is MANAGED (external) — only the app runs here.
# Load the image first:  docker load -i manager-app.tar
services:
  app:
    image: manager-app:latest
    env_file: ./app.env
    ports:
      - "3000:3000"
    volumes:
      # Uploaded photos/documents/logo. Must be a real volume (here) or a PVC (OpenShift) —
      # the container's own filesystem does not survive a restart. Mounting elsewhere?
      # set UPLOADS_DIR in app.env to the mount path.
      - manager-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  manager-uploads:
